<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOZI</title>
<meta name="description" content="VOZI: escucha tus materiales de estudio con voz natural, sin conexión y sin costo.">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VOZI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="saltar" href="#principal">Saltar al contenido</a>
<div id="app" class="app">
  <header class="cabecera" role="banner">
    <div class="marca" aria-label="VOZI"><span class="marca-o">VOZI</span></div>
    <div class="cabecera-titulo" id="cabeceraTitulo" aria-live="polite"></div>
    <div class="cabecera-acciones" id="cabeceraAcciones"></div>
    <button class="avatar" id="perfilBtn" aria-label="Sesión de usuario" hidden></button>
  </header>

  <nav class="pestanas" id="pestanas" aria-label="Secciones">
    <button data-vista="biblioteca" aria-label="Biblioteca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.2 5.1l3.8-1 3.9 15.5-3.8 1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Biblioteca</span></button>
    <button data-vista="importar" aria-label="Importar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Importar</span></button>
    <button data-vista="leer" aria-label="Leer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C5.5 4.5 9 4.5 12 6.5c3-2 6.5-2 9-1v13c-2.5-1-6-1-9 1-3-2-6.5-2-9-1z M12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Leer</span></button>
    <button data-vista="estudiar" aria-label="Estudiar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 10h8M8 14h8M8 18h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Estudiar</span></button>
    <button data-vista="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Ajustes</span></button>
  </nav>

  <main id="principal" class="principal" tabindex="-1"></main>

  <section class="reproductor" id="reproductor" aria-label="Reproductor" hidden>
    <div class="rep-estado" id="repEstado" aria-live="polite"></div>
    <div class="rep-barra" id="repBarra" role="slider" aria-label="Posición en el tramo" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="rep-relleno" id="repRelleno"></div></div>
    <div class="rep-controles">
      <button class="rep-btn" id="repVel" aria-label="Velocidad de lectura">1×</button>
      <button class="rep-btn" id="repAtras" aria-label="Oración anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z" fill="currentColor"/></svg></button>
      <button class="rep-btn rep-principal" id="repPlay" aria-label="Escuchar"><svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg><svg class="ico-pausa" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg></button>
      <button class="rep-btn" id="repAdelante" aria-label="Oración siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor"/></svg></button>
      <button class="rep-btn" id="repMas" aria-label="Más opciones de reproducción"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg></button>
    </div>
  </section>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<dialog id="dialogo" class="dialogo"></dialog>
<noscript><p style="padding:2rem">VOZI necesita JavaScript activado.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
